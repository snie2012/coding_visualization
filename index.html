<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Visualizer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <h1>AlgoViz</h1>
            <p>Algorithm Visualizer</p>
        </div>
        <div class="nav-section">
            <h3>Sorting</h3>
            <button class="nav-btn" data-algo="bubble">Bubble Sort</button>
            <button class="nav-btn" data-algo="merge">Merge Sort</button>
            <button class="nav-btn" data-algo="quick">Quick Sort</button>
            <button class="nav-btn" data-algo="insertion">Insertion Sort</button>
        </div>
        <div class="nav-section">
            <h3>Pathfinding</h3>
            <button class="nav-btn" data-algo="bfs">BFS</button>
            <button class="nav-btn" data-algo="dfs">DFS</button>
            <button class="nav-btn" data-algo="astar">A* Search</button>
            <button class="nav-btn" data-algo="dijkstra">Dijkstra</button>
        </div>
        <div class="nav-section">
            <h3>Trees & Graphs</h3>
            <button class="nav-btn" data-algo="bst">Binary Search Tree</button>
            <button class="nav-btn" data-algo="tree-traversal">Tree Traversal</button>
            <button class="nav-btn" data-algo="graph-dfs">Graph DFS</button>
        </div>
        <div class="nav-section">
            <h3>Dynamic Programming</h3>
            <button class="nav-btn" data-algo="fibonacci">Fibonacci</button>
            <button class="nav-btn" data-algo="knapsack">Knapsack</button>
        </div>
    </nav>

    <main class="content">
        <header class="toolbar">
            <div class="controls">
                <button id="btn-play" class="control-btn">
                    <span class="icon">▶</span> Play
                </button>
                <button id="btn-pause" class="control-btn" disabled>
                    <span class="icon">⏸</span> Pause
                </button>
                <button id="btn-step" class="control-btn">
                    <span class="icon">→</span> Step
                </button>
                <button id="btn-reset" class="control-btn">
                    <span class="icon">↺</span> Reset
                </button>
            </div>
            <div class="speed-control">
                <label for="speed">Speed:</label>
                <input type="range" id="speed" min="1" max="100" value="50">
                <span id="speed-value">50</span>
            </div>
            <div class="size-control">
                <label for="size">Size:</label>
                <input type="range" id="size" min="5" max="100" value="30">
                <span id="size-value">30</span>
            </div>
            <button id="btn-generate" class="control-btn primary">Generate New</button>
        </header>

        <div class="visualization-area">
            <canvas id="canvas"></canvas>
        </div>

        <div class="info-panel">
            <div class="algorithm-info">
                <h2 id="algo-name">Select an Algorithm</h2>
                <p id="algo-description">Choose an algorithm from the sidebar to begin visualization.</p>
            </div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Comparisons</span>
                    <span class="stat-value" id="stat-comparisons">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Swaps</span>
                    <span class="stat-value" id="stat-swaps">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="stat-time">0ms</span>
                </div>
            </div>
            <div class="code-display">
                <h3>Pseudocode</h3>
                <pre id="pseudocode"></pre>
            </div>
        </div>
    </main>

    <!-- Load scripts in correct order (no ES6 modules for file:// compatibility) -->
    <script src="js/engine.js"></script>
    <script src="js/algorithms/info.js"></script>
    <script src="js/visualizers/sorting.js"></script>
    <script src="js/visualizers/pathfinding.js"></script>
    <script src="js/visualizers/tree.js"></script>
    <script src="js/visualizers/graph.js"></script>
    <script src="js/visualizers/dp.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
